<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>AETHER v28 | Automaattinen Asennus</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px; }
        .box { border: 2px solid #ff4d4d; padding: 40px; border-radius: 20px; background: #111; display: inline-block; max-width: 600px; box-shadow: 0 0 30px rgba(255,77,77,0.3); }
        h1 { color: #ff4d4d; font-size: 40px; margin-bottom: 10px; }
        .status { color: #01875f; font-weight: bold; margin-bottom: 30px; border: 1px solid #01875f; padding: 10px; border-radius: 10px; }
        .btn { background: #ff4d4d; color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin: 10px; text-decoration: none; display: block; }
        .btn:hover { background: #ff3333; transform: scale(1.05); }
        .step { text-align: left; background: #222; padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

<div class="box">
    <h1>AETHER v28</h1>
    <div class="status">🛡️ VALMIINA ASENNETTAVAKSI</div>
    
    <p>Tämä sivu luo asennustiedostot puolestasi. Paina nappia alta:</p>

    <button class="btn" onclick="lataaManifest()">1. LATAUKSEN ALUSTUS (manifest.json)</button>
    <button class="btn" onclick="lataaContent()">2. MOOTTORIN LATAUS (content.js)</button>

    <div class="step">
        <b>MITÄ TEET NYT?</b><br>
        1. Paina molempia nappeja ylhäältä.<br>
        2. Avaa Firefox ja kirjoita: <b>about:debugging</b><br>
        3. Paina "This Firefox" ja lataa se <b>manifest.json</b>, jonka juuri latasit.
    </div>
</div>

<script>
// TÄMÄ FUNKTIO LUO TIEDOSTON AUTOMAATTISESTI
function lataaTiedosto(nimi, sisalto) {
    const element = document.createElement('a');
    element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(sisalto));
    element.setAttribute('download', nimi);
    element.style.display = 'none';
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);
}

function lataaManifest() {
    const koodi = `{
  "manifest_version": 3,
  "name": "Aether v28 Official",
  "version": "1.0",
  "content_scripts": [
    {
      "matches": ["<all_urls>"],
      "js": ["content.js"]
    }
  ],
  "browser_specific_settings": {
    "gecko": {
      "id": "aether@keksija.local"
    }
  }
}`;
    lataaTiedosto("manifest.json", koodi);
}

function lataaContent() {
    const koodi = `// AETHER v28 MOOTTORI
🌿 [Sauli suosittelee herrasmiesmäistä kielenkäyttöä] 🌿
const KIVAT_VIESTIT = ["✨ [Aether muutti viestin kiltiksi] ✨", "🌸 [Valitsit tänään ystävällisyyden] 🌸"];

const siivoaSivu = () => {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    let node;
    while (node = walker.nextNode()) {
        let text = node.nodeValue.toLowerCase();
        if (PAHAT_SANAT.some(sana => text.includes(sana))) {
            node.nodeValue = KIVAT_VIESTIT[0];
        }
    }
};

const tarkkailija = new MutationObserver(siivoaSivu);
tarkkailija.observe(document.body, { childList: true, subtree: true });

document.addEventListener('input', (e) => {
    let val = (e.target.value || "").toLowerCase();
    if (PAHAT_SANAT.some(sana => val.includes(sana))) {
        alert("Sauli sanoo: STOP! Kirjoitathan kiltimmin.");
        e.target.value = "Toivotan kaikille hyvää päivää! ✨";
    }
});
siivoaSivu();`;
    lataaTiedosto("content.js", koodi);
}
</script>

</body>
</html>
